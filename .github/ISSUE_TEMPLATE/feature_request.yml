name: Idea or feature request
description: Suggest something Meshgrove should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing or cumbersome today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Meshgrove help?
      description: Your idea for a solution, if you have one. Screenshots or examples from other programs are welcome.
