# cargo-about configuration for THIRD-PARTY-LICENSES.md (built by the release workflow):
#   cargo about generate -c packaging/licenses/about.toml packaging/licenses/about.hbs -o THIRD-PARTY-LICENSES.md
# For dual-licensed crates the first matching license below is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Meshgrove's own crates (publish = false) are covered by LICENSE.
private = { ignore = true }
