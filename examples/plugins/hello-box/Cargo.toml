[package]
name = "hello-box"
description = "Example Meshgrove plugin: makes a box (an AI tool, a panel with a form and a 3D view, a bundle for the library)"
version = "0.1.0"
edition = "2024"
# Like the plugin API: copy freely; plugins may use any license.
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
meshgrove-plugin-api = { path = "../../../crates/meshgrove-plugin-api", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Tools only Meshgrove's tests call: an endless loop and one that eats all memory.
test-hooks = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Not part of Meshgrove's workspace: built for wasm32-wasip2 (scripts/build-plugins.sh).
[workspace]
