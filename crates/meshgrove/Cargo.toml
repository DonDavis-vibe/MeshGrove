[package]
name = "meshgrove"
description = "Gallery browser for 3D-print files (STL, 3MF, STEP) with live previews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
meshgrove-core.workspace = true
meshgrove-render.workspace = true
eframe.workspace = true
egui.workspace = true
egui_tiles.workspace = true
krilla.workspace = true
epaint_default_fonts.workspace = true
egui_commonmark.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
dirs.workspace = true
notify.workspace = true
trash.workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs.workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
clipboard-rs = { version = "0.3", default-features = false }
