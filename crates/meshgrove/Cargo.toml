[package]
name = "meshgrove"
description = "Gallery browser for 3D-print files (STL, 3MF, STEP) with live previews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
meshgrove-core = { workspace = true, features = ["schema"] }
meshgrove-render.workspace = true
eframe.workspace = true
egui.workspace = true
egui_tiles.workspace = true
# The interface themes and the controls drawn from them (vendor/README.md).
solidcraft-theme.workspace = true
solidcraft-ui-kit.workspace = true
solidcraft-ui-text.workspace = true
fontdb.workspace = true
krilla.workspace = true
epaint_default_fonts.workspace = true
egui_commonmark.workspace = true
egui_extras.workspace = true
serde.workspace = true
serde_json.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
# Programs' own icons that only come as SVG (Blender); no text, no pictures inside pictures.
resvg = { version = "0.48", default-features = false }
dirs.workspace = true
notify.workspace = true
trash.workspace = true
ureq.workspace = true
rustls.workspace = true
# The update check: comparing release versions, the packages' SHA-256, the Windows ZIP.
semver = "1"
sha2 = "0.10"
zip.workspace = true
keyring.workspace = true
base64.workspace = true
# The widget trees, events and effects of plugin panels (serde types only).
meshgrove-plugin-api.workspace = true
# Runtime plugins (WebAssembly components); feature "plugins".
meshgrove-plugins = { workspace = true, optional = true, features = ["panels"] }
# The system's file dialog for picking a plugin (the desktop portal on Linux).
rfd = { version = "0.17", optional = true }

[features]
default = ["plugins"]
plugins = ["dep:meshgrove-plugins", "dep:rfd"]

[dev-dependencies]
# The bundled fonts' signs, for a test.
ab_glyph.workspace = true
tempfile = "3"

[build-dependencies]
winresource = "0.1"
# Reads the theme files and the icon palette it embeds.
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs.workspace = true

# Ending an AI agent's whole process group (the helpers it started) when the chat lets it go.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
clipboard-rs = { version = "0.3", default-features = false }

# 3D mouse (SpaceMouse): the HID devices of Windows and macOS (Linux reads /dev/hidraw itself).
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Shared, so a running 3Dconnexion driver does not lock the device.
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
