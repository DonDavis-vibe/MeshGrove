[package]
name = "meshgrove-core"
description = "File formats, mesh loading, indexing and duplicate detection for Meshgrove (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror.workspace = true
glam.workspace = true
fast-float2.workspace = true
blake3.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
png.workspace = true
image.workspace = true
zip.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true
compress-tools.workspace = true
serde_json.workspace = true
gltf.workspace = true
tobj.workspace = true
base64.workspace = true
percent-encoding.workspace = true
ab_glyph.workspace = true
epaint_default_fonts.workspace = true
# JSON schemas of the AI tool parameters, for meshgrove-mcp (feature "schema").
schemars = { version = "1", optional = true }

# Renaming without replacing (renameat2 / renamex_np) for moves the user accepted.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
schema = ["dep:schemars"]

[dev-dependencies]
tempfile = "3"
