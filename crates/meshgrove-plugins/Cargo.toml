[package]
name = "meshgrove-plugins"
description = "Plugin host of Meshgrove: runs WebAssembly plugins in a sandbox (wasmtime) with their rights, limits, jobs and staging folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
meshgrove-core.workspace = true
meshgrove-plugin-api.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
dirs.workspace = true
log.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
# Only for meshgrove-plugin-run (feature "runner"): its MCP server.
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }

[features]
default = ["runner"]
runner = ["dep:rmcp", "dep:tokio", "dep:base64", "dep:env_logger"]

[[bin]]
name = "meshgrove-plugin-run"
path = "src/bin/meshgrove-plugin-run.rs"
required-features = ["runner"]

[dev-dependencies]
tempfile = "3"
