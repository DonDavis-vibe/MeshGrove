[workspace]
resolver = "3"
members = [
    "crates/meshgrove-core",
    "crates/meshgrove-render",
    "crates/meshgrove",
    "crates/meshgrove-step",
    "crates/meshgrove-thumbnailer",
    "crates/meshgrove-mcp",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Davis (German Redneck Engineering)"]
repository = "https://github.com/DonDavis-vibe/MeshGrove"
homepage = "https://redneck-design.de/"
description = "Native gallery for 3D-print files (STL, 3MF, STEP) with live previews"
keywords = ["stl", "3mf", "3d-printing", "gallery", "egui"]

[workspace.dependencies]
meshgrove-core = { path = "crates/meshgrove-core" }
meshgrove-render = { path = "crates/meshgrove-render" }

anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
fast-float2 = "0.2"
blake3 = "1.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "qoi"] }
pollster = "1.0"
wgpu = "30"
egui-wgpu = "0.37"
krilla = "0.8"
epaint_default_fonts = "0.37"
ab_glyph = "0.2"
egui_extras = { version = "0.37", default-features = false }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
egui_tiles = { version = "0.18", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "system_fonts", "accesskit"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
dirs = "7.0"
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
notify = "8.2"
compress-tools = "0.16"
trash = "5.2"
serde_json = "1.0"
gltf = { version = "1.4", default-features = false, features = ["utils"] }
tobj = { version = "4.0", default-features = false }
base64 = "0.23"
# Only in meshgrove-mcp: the MCP server for the user's own AI assistant.
rmcp = { version = "3.7", default-features = false, features = ["server", "macros", "transport-io", "schemars", "base64"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
schemars = "1"
# Only in the app: the user's own OpenAI-compatible endpoint (chat, one-click actions).
# TLS through the platform's certificate store, so no bundled root list is needed.
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier", "json", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4.2"
percent-encoding = "2.3"
wl-clipboard-rs = "0.9"
sys-locale = "0.3"

[profile.dev.package."*"]
# Mesh parsing and image encoding are painfully slow unoptimized; keep our own code debuggable.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
